services:
  nearbuy:
    build:
      context: .
      dockerfile: Dockerfile
    image: nearbuy:production
    init: true
    restart: unless-stopped
    env_file:
      - backend/.env
    ports:
      - "127.0.0.1:5000:5000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 25s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
